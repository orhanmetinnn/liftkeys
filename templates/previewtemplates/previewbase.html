{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

    <title>{% block title %}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}{{ meta_description|default:"Liftkeys, asansör sektörü için inovatif ve sertifikalı çözümler sunar." }}{% endblock %}">
    <meta name="robots" content="{% block meta_robots %}index,follow{% endblock %}">

    <meta name="keywords" content="{% block meta_keywords %}{% endblock %}">


    <meta property="og:locale" content="tr_TR">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:site_name" content="Liftkeys">
    <meta property="og:title" content="{% block og_title %}Liftkeys | Asansör Çözümleri{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Liftkeys, asansör sektörü için inovatif ve sertifikalı çözümler sunar.{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{% if request %}{{ request.build_absolute_uri }}{% else %}https://www.liftkeys.com{% endif %}{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{% endblock %}">

    {# === Twitter Cards === #}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block tw_title %}Liftkeys | Asansör Çözümleri{% endblock %}">
    <meta name="twitter:description" content="{% block tw_description %}Liftkeys, asansör sektörü için inovatif ve sertifikalı çözümler sunar.{% endblock %}">
    <meta name="twitter:image" content="{% block tw_image %}{% endblock %}">

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/previwmenu.css' %}">
    <link rel="stylesheet" href="{% static 'css/font.css' %}">
    <link 
    rel="preload"
    as="image"
    href="{% static 'image/preview/banner-liftkeys-headersformlow.webp' %}"
    imagesizes="100vw"
    fetchpriority="high">

    {% block extra_css %}{% endblock %}

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <script src="{% static 'js/chart.js' %}"></script>
    
    <style>
        /* Genel Ayarlar */
        body {
            overflow-x: hidden; /* Sayfa genelinde yatay taşmayı engelle */
            -webkit-tap-highlight-color: transparent;
        }

        /* WhatsApp Widget (Masaüstü ve Mobil Ortak) */
        .whatsapp-widget {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 60px;
            height: 60px;
            z-index: 9999;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .whatsapp-widget img {
            width: 100%;
            height: 100%;
            display: block; /* Resim altındaki boşluğu alır */
        }

        .whatsapp-widget:hover {
            transform: scale(1.1);
        }

        /* --- MOBİL GÖRÜNÜM AYARLARI --- */
        @media (max-width: 768px) {
            
            /* Menünün altında içerik kalmasın diye boşluk bırakıyoruz */
            body {
                padding-bottom: 70px;
            }

            .mobile-bottom-menu {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 60px;
                background: #fff;
                border-top: 1px solid #eaeaea;
                z-index: 9999;
                
                /* Esnek Kutu Ayarları */
                display: flex;
                align-items: center;
                /* justify-content: space-around; -> Bunu kaldırıyoruz ki sığmazsa scroll çalışsın */
                
                /* Kaydırma ve Sığdırma Ayarları */
                overflow-x: auto; /* Sığmazsa yatay kaydır */
                overflow-y: hidden;
                white-space: nowrap; /* Öğeleri yan yana tut */
                -webkit-overflow-scrolling: touch; /* Mobilde akıcı kaydırma */
                
                /* Scrollbar'ı gizle (Estetik için) */
                scrollbar-width: none; /* Firefox */
                -ms-overflow-style: none;  /* IE/Edge */
            }

            .mobile-bottom-menu::-webkit-scrollbar {
                display: none; /* Chrome/Safari */
            }

            .mobile-bottom-menu .menu-item {
                /* Her bir öğe için ayarlar */
                flex: 1 0 auto; /* Büyüyebilir ama küçülmesin, içeriği kadar yer kaplasın */
                min-width: 70px; /* Bir butonun alacağı minimum genişlik */
                padding: 5px 0;
                
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                
                color: #555;
                text-decoration: none;
                font-size: 11px; /* Yazı boyutu */
            }

            /* Aktif buton veya hover durumu için (Opsiyonel) */
            .mobile-bottom-menu .menu-item:active {
                background-color: #f9f9f9;
            }

            .mobile-bottom-menu .menu-item i {
                font-size: 20px;
                margin-bottom: 4px;
                color: #f46e21;
                display: block;
            }

            .mobile-bottom-menu .menu-item span {
                line-height: 1;
                display: block;
            }

            /* Mobilde WhatsApp butonunu yukarı taşıyoruz */
            .whatsapp-widget {
                bottom: 80px; 
                left: auto;
                right: 15px; /* Mobilde sağ tarafta durması daha ergonomiktir */
                width: 50px;
                height: 50px;
            }
        }
    </style>

</head>
<body lang="{{ LANGUAGE_CODE }}">
    
    {% include "previewtemplates/previewmenu.html" %}
    {% block content %}{% endblock %}
    
    <a href="https://wa.me/905332880821" 
       class="whatsapp-widget d-none d-md-block" 
       target="_blank" 
       rel="noopener">
       <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" />
    </a>

    <div class="mobile-bottom-menu d-md-none">
        <a href="/" class="menu-item">
            <i class="fa-solid fa-house"></i>
            <span>Anasayfa</span>
        </a>
        <a href="{% url 'category_list' %}" class="menu-item">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Ürünler</span>
        </a>
        <a href="/katalog" class="menu-item">
            <i class="fa-solid fa-file-pdf"></i>
            <span>Katalog</span>
        </a>
        <a href="https://wa.me/905332880821" class="menu-item">
            <i class="fa-brands fa-whatsapp"></i>
            <span>WhatsApp</span>
        </a>
        <a href="/contact/" class="menu-item">
            <i class="fa-solid fa-phone"></i>
            <span>İletişim</span>
        </a>
    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
